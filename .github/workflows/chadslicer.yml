name: Build ChadSlicer

# Builds the Windows (portable zip) and macOS (dmg) packages.
# Run it from the Actions tab, or push a tag starting with "v" to also publish a release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      # Short paths avoid the Windows path length limit in the dependency builds.
      DEPS_BUILD: C:\cs\deps
      DEPS_PREFIX: C:\cs\deps\destdir\usr\local
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\cs\deps\destdir
          key: deps-windows-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          # Release only, debug libraries would double the build time.
          cmake -S deps -B "$env:DEPS_BUILD" -G "Visual Studio 17 2022" -A x64 -DDEP_DEBUG=OFF
          cmake --build "$env:DEPS_BUILD" --config Release

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\cs\deps\destdir
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build ChadSlicer
        run: |
          # Release only to match the dependencies, otherwise the find modules ask for debug libraries.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_CONFIGURATION_TYPES=Release -DSLIC3R_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$env:DEPS_PREFIX"
          cmake --build build --config Release --parallel

      - name: Package
        id: package
        run: |
          $version = (Select-String -Path version.inc -Pattern 'SLIC3R_VERSION "(.*)"').Matches[0].Groups[1].Value
          $name = "ChadSlicer-$version-windows-x64"
          $out = "dist\$name"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\src\Release\*.exe, build\src\Release\*.dll $out
          if (Test-Path build\src\Release\mesa) { Copy-Item build\src\Release\mesa $out\mesa -Recurse }
          Copy-Item resources $out\resources -Recurse
          # The launchers load PrusaSlicer.dll from their own directory, renaming them is safe.
          Rename-Item $out\prusa-slicer.exe ChadSlicer.exe
          Rename-Item $out\prusa-slicer-console.exe ChadSlicer-console.exe
          Rename-Item $out\prusa-gcodeviewer.exe ChadSlicer-gcodeviewer.exe
          Compress-Archive -Path $out -DestinationPath "dist\$name.zip"
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip

  macos:
    runs-on: macos-14
    timeout-minutes: 360
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install autoconf automake libtool texinfo ninja

      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build/destdir
          key: deps-macos-arm64-${{ hashFiles('deps/CMakeLists.txt', 'deps/**/*.cmake', 'deps/**/*.patch') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          # gmplib.org is not reachable from the runners, take the same tarball from the GNU mirror.
          # The dependency build checks its SHA256 and skips the download.
          mkdir -p deps/build/downloads/GMP
          curl -fsSL --retry 3 -o deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 https://ftpmirror.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2 \
            || curl -fsSL --retry 3 -o deps/build/downloads/GMP/gmp-6.2.1.tar.bz2 https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.bz2
          echo "eae9326beb4158c386e39a356818031bd28f3124cf915f8c5b1dc4c7a36b4d7c  deps/build/downloads/GMP/gmp-6.2.1.tar.bz2" | shasum -a 256 -c
          cmake -S deps -B deps/build -G Ninja -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET
          cmake --build deps/build

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build/destdir
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build ChadSlicer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSLIC3R_BUILD_TESTS=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_PREFIX_PATH="$PWD/deps/build/destdir/usr/local"
          cmake --build build

      - name: Package
        id: package
        run: |
          packaging/macos/make_dmg.sh build dist
          echo "dmg=$(ls dist/*.dmg)" >> "$GITHUB_OUTPUT"
          echo "name=$(basename dist/*.dmg .dmg)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.dmg }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
