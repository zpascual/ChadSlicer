## Printers

[printer:Phrozen Sonic Mighty 8K]
printer_technology = SLA
# Also stored as the machine name in the CTB file, same as written by Chitubox.
printer_model = Phrozen Sonic Mighty 8K
printer_variant = default
default_sla_material_profile = Phrozen Speed Resin @MIGHTY8K
default_sla_print_profile = 0.15 Speed @MIGHTY8K
thumbnails = 400x300,200x125
sla_archive_format = CTB
bed_shape = 0x0,218.88x0,218.88x123.12,0x123.12
# 7680 x 4320 px LCD, 28.5 um pixels.
display_orientation = landscape
display_mirror_x = 0
display_mirror_y = 0
display_pixels_x = 7680
display_pixels_y = 4320
display_width = 218.88
display_height = 123.12
max_print_height = 235
elefant_foot_compensation = 0
elefant_foot_min_width = 0.2
min_exposure_time = 0.5
max_exposure_time = 120
min_initial_exposure_time = 1
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1
# Chitubox anti-aliasing: Gray Scale Level, 8 levels, 0 - 255, picture grayscale 255.
antialiasing = 1
grayscale_level = 8
grayscale_min = 0
grayscale_max = 255
picture_grayscale = 255
printer_notes = Don't remove the following keywords! These keywords are used in the "compatible printer" condition of the print and filament profiles to link the particular print and filament profiles to this printer profile.\nPRINTER_VENDOR_PHROZEN\nPRINTER_MODEL_SONICMIGHTY8K\nPRINTER_TECHNOLOGY_SLA\n
