# Print profiles for the Phrozen MSLA printers, which read Chitubox (CTB) files.

[vendor]
repo_id = non-prusa-sla
# Vendor name will be shown by the Config Wizard.
name = Phrozen
# Configuration version of this file. Config file will only be installed, if the config_version differs.
config_version = 1.2.0

# The printer models will be shown by the Configuration Wizard in this order,
# also the first model installed & the first nozzle installed will be activated after install.
[printer_model:Phrozen Sonic Mighty 8K]
name = Sonic Mighty 8K
variants = default
technology = SLA
family = SONIC
# All the resins are installed together with the printer.
default_materials = Phrozen Speed Resin @MIGHTY8K; Phrozen ABS-Like Resin @MIGHTY8K (tested 0.05mm); Phrozen AnyCast @MIGHTY8K (tested 0.03mm); Phrozen Aqua 4K Resin @MIGHTY8K (tested 0.05mm); Phrozen Aqua 8K Resin @MIGHTY8K (tested 0.05mm); Phrozen Aqua Clear Plus @MIGHTY8K (tested 0.05mm); Phrozen Aqua Hyperfine Resin @MIGHTY8K (tested 0.03mm); Phrozen Aqua Macaroon Resin @MIGHTY8K (tested 0.05mm); Phrozen Aqua Mist @MIGHTY8K (tested 0.05mm); Phrozen Aqua Oat @MIGHTY8K (tested 0.05mm); Phrozen Aqua Resin @MIGHTY8K (tested 0.05mm); Phrozen BJD @MIGHTY8K (tested 0.05mm); Phrozen BJD Soft @MIGHTY8K (tested 0.1mm); Phrozen Castable Resin @MIGHTY8K (tested 0.05mm); Phrozen Ceramic @MIGHTY8K (tested 0.05mm); Phrozen Ceramic Pro @MIGHTY8K (tested 0.05mm); Phrozen EL400 @MIGHTY8K (tested 0.1mm); Phrozen FR940 @MIGHTY8K (tested 0.05mm); Phrozen Neon Resin @MIGHTY8K (tested 0.05mm); Phrozen Nylon-Green Tough Resin @MIGHTY8K (tested 0.05mm); Phrozen Onyx Impact Plus @MIGHTY8K (tested 0.05mm); Phrozen ONYX Rigid Pro 410 @MIGHTY8K (tested 0.05mm); Phrozen Protowhite @MIGHTY8K (tested 0.05mm); Phrozen Rigid PC-GF-Like @MIGHTY8K (tested 0.05mm); Phrozen Rock-Black Stiff Resin @MIGHTY8K (tested 0.05mm); Phrozen RPG @MIGHTY8K (tested 0.05mm); Phrozen Speed Plus @MIGHTY8K (tested 0.05mm); Phrozen Speed Resin @MIGHTY8K (tested 0.15mm); Phrozen Tough 100E @MIGHTY8K (tested 0.05mm); Phrozen Tough ABS-Like+ @MIGHTY8K (tested 0.05mm); Phrozen TR250LV High Temp Resin @MIGHTY8K (tested 0.05mm); Phrozen TR300 Ultra-High Temp Resin @MIGHTY8K (tested 0.05mm); Phrozen Water Washable Tough @MIGHTY8K (tested 0.05mm); Phrozen Water-Washable Resin @MIGHTY8K (tested 0.05mm); Phrozen Xmas Special Resin @MIGHTY8K (tested 0.05mm); BASF EL4000B @MIGHTY8K (tested 0.05mm); BASF EPJ1300 @MIGHTY8K (tested 0.05mm); BASF EPJ2100 @MIGHTY8K (tested 0.05mm); BASF FL60 @MIGHTY8K (tested 0.05mm); BASF RG1100 @MIGHTY8K (tested 0.05mm); BASF RG1100B @MIGHTY8K (tested 0.05mm); BASF RG3280 @MIGHTY8K (tested 0.05mm); BASF RG35 @MIGHTY8K (tested 0.05mm); BASF RG35B @MIGHTY8K (tested 0.15mm); BASF ST45 @MIGHTY8K (tested 0.05mm); BASF ST45B @MIGHTY8K (tested 0.05mm); BASF ST45M @MIGHTY8K (tested 0.05mm); BASF ST7500G @MIGHTY8K (tested 0.05mm); BASF ST80 @MIGHTY8K (tested 0.05mm); BASF ST80B @MIGHTY8K (tested 0.05mm); BASF ST80W @MIGHTY8K (tested 0.05mm); Henkel IND249 @MIGHTY8K (tested 0.1mm); Henkel IND5714 @MIGHTY8K (tested 0.1mm); Henkel IND6845 @MIGHTY8K (tested 0.1mm); Henkel PRO476 @MIGHTY8K (tested 0.1mm); Henkel PRO9274 @MIGHTY8K (tested 0.05mm)

## SLA prints

[sla_print:*common print PHROZEN SLA*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_PHROZEN.*/ and printer_notes=~/.*SLA.*/
output_filename_format = [input_filename_base].ctb
layer_height = 0.05
faded_layers = 6
pad_edge_radius = 0.5
pad_enable = 1
pad_max_merge_distance = 50
pad_wall_height = 0
pad_wall_thickness = 1
pad_wall_slope = 45
slice_closing_radius = 0.005
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_density_at_45 = 250
support_density_at_horizontal = 500
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_max_bridge_length = 10
support_minimal_z = 0
support_object_elevation = 5
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
supports_enable = 1
support_small_pillar_diameter_percent = 60%

[sla_print:0.05 Normal @MIGHTY8K]
inherits = *common print PHROZEN SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_SONICMIGHTY8K.*/
layer_height = 0.05

[sla_print:0.10 Fast @MIGHTY8K]
inherits = *common print PHROZEN SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_SONICMIGHTY8K.*/
layer_height = 0.1

[sla_print:0.15 Speed @MIGHTY8K]
inherits = *common print PHROZEN SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_SONICMIGHTY8K.*/
layer_height = 0.15

## SLA materials

[sla_material:*common PHROZEN SLA*]
compatible_printers_condition = printer_notes=~/.*PRINTER_VENDOR_PHROZEN.*/ and printer_notes=~/.*SLA.*/
material_correction = 1,1,1
material_density = 1.1
bottle_volume = 1000
bottle_weight = 1.1
bottom_layers = 6
transition_layers = 6
tower_bottom_lift_height = 3
tower_bottom_lift_speed = 100
tower_bottom_retract_speed = 150
tower_lift_height = 3
tower_lift_speed = 100
tower_retract_speed = 150
wait_before_cure = 1
wait_after_cure = 0
wait_after_lift = 0
bottom_light_pwm = 255
light_pwm = 255

# Material presets are compatible with any layer height. Exposures are the values published by
# Phrozen (midpoints of the published ranges) for the layer height named in the preset,
# other layer heights need the exposure to be tuned.

# Same values as the Chitubox resin profile "Speed Resin -150um" for the Sonic Mighty 8K (the profile
# used so far, the values published by Phrozen are in "Phrozen Speed Resin @MIGHTY8K (tested 0.15mm)").
[sla_material:Phrozen Speed Resin @MIGHTY8K]
inherits = *common PHROZEN SLA*
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_SONICMIGHTY8K.*/
exposure_time = 3
initial_exposure_time = 20
initial_layer_height = 0.15
material_type = Tough
material_vendor = Phrozen
material_colour = #A0A0A0

# Resin settings published by Phrozen for the Sonic Mighty 8K
# (https://info.phrozen3d.com/pages/resin-sonic-mighty-8k), one preset per resin.

